target_base_dir: data/targets/receptors
target_box_center_path: data/targets/docking_centers.json
target_choose_list: data/targets/train_target_index.json
target_index: data/targets/target_index_cleaned.json
train_data_path: data/supervised/train.pkl  # Used for novelty logging.

batch_size: 128
num_episodes: 4000
save_freq: 500
lr: 0.000005
weight_decay: 0.0001
ratio_denovo_scaffold: [1.0, 0.0]

entropy_coef: 0.05
prediction_head_freeze: true
emb_mse_coef: 0.0

top_k_0: 500
top_k: 300
top_p: 0.9
temperature: 1.0
rxn_mode: random
max_workers: 40

reward_method: quadratic_baseline
penalty_reward: -1.0
penalty_staged: true
penalty_trunc: -0.5
vina_base: -5.5
quantile_q: 0.75
step_reward: 0.1

use_historical_penalty: false
per_target_buffer_size: 500
sim_threshold: 0.50
max_discount_ratio: 0.9

template_freq_threshold: 0.10
template_penalty_factor: 30.0

hard_min_qed: 0.6
hard_min_logp: -2.0
hard_max_logp: 5.0
hard_min_mw: 100
hard_max_mw: 700
hard_max_hydrogen_donor: 5
hard_max_hydrogen_acceptor: 10
hard_max_nrotb: 10
hard_max_tpsa: 140
